[project]
name = "high-street-property-occupancy-tracking-motip"
version = "0.1.0"
description = "MOTIP-based high-street property occupancy tracking."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.4.0",
  "torchvision==0.19.0",
  "torchaudio==2.4.0",
  "pyyaml",
  "tqdm",
  "matplotlib",
  "scipy",
  "pandas",
  "wandb",
  "accelerate",
  "einops",
  "setuptools",
  "wheel",
  "mlflow",
  "numpy",
  "opencv-python",
  "optuna",
  "pillow",
  "pycocotools",
  "scikit-image",
]

[dependency-groups]
dev = [
  "pytest",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }

[tool.uv]
package = false
